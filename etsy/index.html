<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Etsy connection</title>
<style>
:root{--teal:#1f6f78;--bg:#fdf6ec;--ink:#24323a}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,sans-serif;padding:24px 16px}
.box{max-width:560px;margin:0 auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
h1{color:var(--teal);font-size:26px;margin:0 0 8px}
code{display:block;word-break:break-all;background:#e3f0f0;border-radius:10px;padding:14px;font-size:16px;margin:12px 0}
button{background:var(--teal);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-size:17px;font-weight:700}
.err{color:#9b1c1c}
</style></head><body><div class="box" id="b">Loading…</div>
<script>
const q = new URLSearchParams(location.search), b = document.getElementById('b');
if (q.get('code')) {
  const all = 'code=' + q.get('code') + '\nstate=' + (q.get('state') || '');
  b.innerHTML = '<h1>Connected — one last step</h1><p>Copy this and send it to Claude in the chat:</p><code id="c"></code><button id="k">Copy</button><p style="font-size:14px;color:#6b7280">It works for a few minutes only, so send it straight away.</p>';
  document.getElementById('c').textContent = all;
  document.getElementById('k').onclick = () => navigator.clipboard.writeText(all).then(() => document.getElementById('k').textContent = 'Copied ✓');
} else if (q.get('error')) {
  b.innerHTML = '<h1 class="err">Etsy said no</h1><p></p>'; b.querySelector('p').textContent = q.get('error') + ' — ' + (q.get('error_description') || '') + '. Tell Claude what happened.';
} else {
  b.innerHTML = '<h1>Etsy connection page</h1><p>This page is used by Carewell Kits to connect its Etsy shop. Nothing to do here.</p>';
}
</script></body></html>
